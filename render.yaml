services:
  # Web Service (não static): o processo mantém o WebSocket de sinalização em
  # /ws e entrega o instalador em /app.apk. Não há site — nada da roda abre no
  # navegador.
  - type: web
    name: roda-chamadas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
