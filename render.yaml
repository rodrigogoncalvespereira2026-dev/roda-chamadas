services:
  # Web Service (não static): o mesmo processo serve o dist/ e mantém o
  # WebSocket de sinalização em /ws.
  - type: web
    name: roda-chamadas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
